services:
  - type: web
    name: telegram-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: IMAGE_GEN
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
